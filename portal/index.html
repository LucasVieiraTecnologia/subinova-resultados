<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Resultados e Indicadores · SUBINOVA</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230284c7'><path d='M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z'/></svg>">
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- ==================== CAMADA DE FUNDO: POWER BI ==================== -->
  <!-- Carrega no fundo desde o primeiro segundo -->
  <div id="pbi-layer" class="pbi-layer">
    <div id="pbi-loading" class="pbi-loading">
      <div class="pbi-spinner"></div>
      <p>Carregando Painel Power BI...</p>
    </div>
    <iframe 
      id="pbi-iframe"
      title="Painel de Resultados Power BI"
      src="https://app.powerbi.com/view?r=eyJrIjoiNjA5MDA2YmEtODY2MS00NGUxLWFhNzctMjE0OTAxYzU4ZGNjIiwidCI6ImU1ZDNhZTdjLTliMzgtNDhkZS1hMDg3LWY2NzM0YTI4NzU3NCJ9"
      frameborder="0" 
      allowFullScreen="true"
    ></iframe>
  </div>

  <!-- ==================== CAMADA EM TELA TODA: VÍDEO DE LOAD (4 SEGUNDOS) ==================== -->
  <video 
    id="bg-video" 
    class="fullscreen-video"
    autoplay 
    muted 
    playsinline 
    preload="auto"
  >
    <source src="videoResultados.mp4" type="video/mp4">
  </video>

  <!-- Botão Pular Abertura -->
  <button id="btn-skip-video" class="btn-skip-video" title="Pular vídeo e acessar diretamente com senha">
    <span>Pular Abertura</span>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <polygon points="5 4 15 12 5 20 5 4"/>
      <line x1="19" y1="5" x2="19" y2="19"/>
    </svg>
  </button>

  <!-- ==================== MODAL DE AUTENTICAÇÃO (SURGE APÓS OS ~4S DO LOAD) ==================== -->
  <div id="auth-modal" class="auth-backdrop hidden">
    <div class="auth-card">
      <div class="auth-badge">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <span>ACESSO AO PAINEL INTERATIVO</span>
      </div>

      <!-- Banner de Comunicados (ativado pelo Administrador) -->
      <div id="auth-banner" class="auth-banner hidden">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        <span id="auth-banner-text"></span>
      </div>

      <div class="auth-header">
        <h1>Autenticação de Segurança</h1>
        <p>Digite a senha para acessar o painel de resultados:</p>
      </div>

      <form id="auth-form" autocomplete="off" onsubmit="return false;">
        <div class="input-group">
          <label for="password-input">Chave de Acesso</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input 
              type="password" 
              id="password-input" 
              placeholder="Digite a senha..." 
              required
              autofocus
            >
            <button type="button" id="btn-toggle-eye" class="icon-eye" title="Mostrar/Ocultar Senha">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <div id="auth-error" class="error-msg">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <circle cx="12" cy="12" r="10"/>
              <line x1="12" y1="8" x2="12" y2="12"/>
              <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <span id="auth-error-text">Senha incorreta. Tente novamente.</span>
          </div>
        </div>

      </form>

      <div class="auth-footer">
        <span class="security-tag">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.2">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
          Autenticação criptografada
        </span>
        <a href="admin.html" class="admin-discrete-link" title="Painel Administrativo (Ctrl+Shift+A)">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
          ADM
        </a>
      </div>
    </div>
  </div>

  <script src="config.js?v=2.1.0"></script>
  <script src="app.js?v=2.1.0"></script>
</body>
</html>
